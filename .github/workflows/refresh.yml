name: Refresh prices

# Vercel's Hobby plan caps cron jobs at ONCE PER DAY, which is too slow for a
# price-comparison site — resale prices move through the day and a fixture can
# sell out between refreshes. GitHub Actions has no such limit on public repos,
# so it does the frequent refreshing and vercel.json keeps a daily run as a
# backstop in case this workflow is ever disabled.
#
# Setup (one time, in the GitHub repo → Settings → Secrets and variables → Actions):
#   Secret   CRON_SECRET  — must match the CRON_SECRET set in Vercel
#   Variable SITE_URL     — your deployed URL, e.g. https://scoreticket.vercel.app

on:
  schedule:
    # Every 2 hours. GitHub queues scheduled runs, so treat the time as
    # approximate — it can drift by several minutes under load.
    - cron: '0 */2 * * *'
  # Lets you trigger a refresh by hand from the Actions tab.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price refresh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL variable or CRON_SECRET secret is not set — skipping."
            echo "Add them in Settings → Secrets and variables → Actions."
            exit 0
          fi

          echo "Refreshing $SITE_URL ..."
          # The scrape walks six sources, so allow a generous timeout. --fail-with-body
          # surfaces the response text when the endpoint returns an error status.
          http_code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 600 \
            -X POST "$SITE_URL/api/cron/refresh" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $http_code"
          head -c 2000 /tmp/out.json || true
          echo

          # 401 means the secrets don't match; anything 5xx means the refresh broke.
          if [ "$http_code" != "200" ]; then
            echo "::error::Refresh failed with HTTP $http_code"
            exit 1
          fi
